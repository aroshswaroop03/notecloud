<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note-Cloud — Shared note</title>
  <link rel="icon" href="/static/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #f7f4ee;
      --surface:    #fffefb;
      --border:     rgba(26,23,18,.10);
      --ink:        #1a1712;
      --accent:     #b5502f;
      --accent-dim: #7a3319;
      --accent2:    #e0a622;
      --text:       #1a1712;
      --muted:      #756f62;
      --success:    #3a8a5c;
      --error:      #a3402e;
      --radius:  6px;
      --shadow:    5px 5px 0 var(--ink);
      --shadow-sm: 3px 3px 0 var(--ink);
      --shadow-lg: 9px 9px 0 var(--ink);
      --grid-line: rgba(26,23,18,.035);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 4rem;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* glow */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 260px;
      background: radial-gradient(ellipse at 50% 0%, rgba(181,80,47,.12), transparent 70%);
      pointer-events: none;
    }

    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0 2rem;
    }
    .logo {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.5px;
      text-transform: uppercase;
      line-height: .9;
    }
    .logo span { color: var(--accent); }

    .try-btn {
      padding: .5rem 1.2rem;
      background: var(--accent);
      color: #fff;
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: transform .15s, box-shadow .15s;
    }
    .try-btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
    .try-btn:active { transform: translate(0,0); box-shadow: 1px 1px 0 var(--ink); }

    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 3px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: slide-in .45s cubic-bezier(.2,.8,.4,1) both;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      padding: 1.1rem 1.5rem .9rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .card-label {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--ink);
      background: var(--accent2);
      border: 2px solid var(--ink);
      padding: .15rem .5rem;
    }
    .card-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .72rem;
      color: var(--muted);
    }

    .card-text {
      padding: 1.5rem;
      font-size: 1rem;
      line-height: 1.85;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card-footer {
      padding: .85rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
    }
    .word-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .74rem;
      color: var(--muted);
    }

    .copy-btn {
      padding: .42rem 1rem;
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .4rem;
      box-shadow: var(--shadow-sm);
      transition: transform .15s, box-shadow .15s, border-color .15s, background .15s, color .15s;
    }
    .copy-btn:hover { border-color: var(--accent); background: rgba(181,80,47,.06); transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
    .copy-btn:active { transform: translate(0,0); box-shadow: 1px 1px 0 var(--ink); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }

    .attribution {
      margin-top: 2rem;
      font-size: .8rem;
      color: var(--muted);
      text-align: center;
    }
    .attribution a { color: var(--accent); text-decoration: none; }
    .attribution a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Note<span>-</span>Cloud</div>
    <a class="try-btn" href="/login">Try it free →</a>
  </header>

  <div class="card">
    <div class="card-header">
      <span class="card-label">Shared transcription</span>
      <span class="card-meta">
        Shared by {{ item.first_name }} {{ item.last_name }}
        &nbsp;·&nbsp;
        {{ item.created_at[:10] }}
      </span>
    </div>

    <div class="card-text" id="transcription-text">{{ item.text }}</div>

    <div class="card-footer">
      <span class="word-count">{{ item.word_count }} word{{ 's' if item.word_count != 1 else '' }}</span>
      <button class="copy-btn" id="copy-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy text
      </button>
    </div>
  </div>

  <p class="attribution">
    Transcribed with <a href="/login">Note-Cloud</a> — turn handwritten notes into text instantly.
  </p>

  <script>
    document.getElementById("copy-btn").addEventListener("click", function() {
      const text = document.getElementById("transcription-text").textContent;
      navigator.clipboard.writeText(text).then(() => {
        this.textContent = "Copied!";
        this.classList.add("copied");
        setTimeout(() => {
          this.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy text`;
          this.classList.remove("copied");
        }, 2000);
      });
    });
  </script>

</body>
</html>
